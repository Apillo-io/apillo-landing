# Apillo Landing - Docker Compose with Tailscale
#
# Tailscale auth key al: https://login.tailscale.com/admin/settings/keys
# Sonra .env dosyasına TAILSCALE_AUTH_KEY=tskey-auth-... olarak kaydet
#
# Başlatmak için:
#   cp .env.example .env
#   # .env dosyasını düzenle, TAILSCALE_AUTH_KEY ekle
#   docker compose up -d

services:
  apillo-landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apillo-landing
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost}
    networks:
      - ApilloNet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      tailscale:
        condition: service_healthy

  tailscale:
    image: tailscale/tailscale:latest
    container_name: apillo-tailscale
    environment:
      - TS_AUTH_KEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-exit-node
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - /var/run/tailscale:/var/run/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    network_mode: host
    privileged: true
    restart: unless-stopped
    command: >
      sh -c "
      tailscaled &
      sleep 3 &&
      tailscale up --accept-routes --advertise-exit-node --hostname apillo-landing
      tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  ApilloNet:
    driver: bridge

volumes:
  tailscale-state:
    name: apillo-tailscale-state